# CodeRabbit Full-Repository Configuration
version: "2"
language: "en-US"
reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "master"
  tools:
    ast-grep:
      enabled: true
    shellcheck:
      enabled: true
    markdownlint:
      enabled: true
  path_filters:
    - "!**/build/**"
    - "!**/.dart_tool/**"
    - "!**/ios/Pods/**"
    - "!**/android/.gradle/**"
chat:
  auto_reply: true
