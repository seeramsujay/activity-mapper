# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# NOTE: the v2 schema has no top-level `version` key. An unknown key makes the file invalid, and CodeRabbit then
# silently falls back to defaults (only the default branch is reviewed), so PRs into other branches were skipped.
language: "en-US"
tone_instructions: "You are an expert reviewer for open-source Android applications written in Kotlin and Jetpack Compose under the GNU AGPL v3.0 license. Prioritize memory leaks, lifecycle issues, Coroutine/Flow concurrency bugs, crash-proof WAL reliability, GPS battery consumption, and Material 3 design accessibility."
early_access: false

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  sequence_diagrams: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "master"
      - "redesign-v2"
  tools:
    ast-grep:
      enabled: true
    shellcheck:
      enabled: true
    markdownlint:
      enabled: true
    github-checks:
      enabled: true
  path_filters:
    - "!**/build/**"
    - "!**/.dart_tool/**"
    - "!**/ios/Pods/**"
    - "!**/android/.gradle/**"

chat:
  auto_reply: true
