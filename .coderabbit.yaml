# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# NOTE: this file must satisfy the schema above or CodeRabbit silently falls back to defaults (only the default
# branch is reviewed, so PRs into other branches are skipped). Two things broke it before: a top-level `version`
# key (not in the v2 schema) and a `tone_instructions` value over the 250-character limit.
language: "en-US"
tone_instructions: "Expert Kotlin/Jetpack Compose reviewer (AGPL-3.0 Android app). Prioritize memory leaks, lifecycle issues, coroutine/Flow concurrency bugs, WAL crash-safety, GPS battery use, and Material 3 accessibility."
early_access: false

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  sequence_diagrams: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "master"
      - "redesign-v2"
  tools:
    ast-grep:
      enabled: true
    shellcheck:
      enabled: true
    markdownlint:
      enabled: true
    github-checks:
      enabled: true
  path_filters:
    - "!**/build/**"
    - "!**/.dart_tool/**"
    - "!**/ios/Pods/**"
    - "!**/android/.gradle/**"

chat:
  auto_reply: true
