# CodeRabbit Full-Repository Configuration
# NOTE: the v2 schema has no top-level `version` key. An unknown key makes the file invalid, and CodeRabbit then
# silently falls back to defaults (only the default branch is reviewed), so PRs into other branches were skipped.
language: "en-US"
reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "master"
      - "redesign-v2"
  tools:
    ast-grep:
      enabled: true
    shellcheck:
      enabled: true
    markdownlint:
      enabled: true
  path_filters:
    - "!**/build/**"
    - "!**/.dart_tool/**"
    - "!**/ios/Pods/**"
    - "!**/android/.gradle/**"
chat:
  auto_reply: true
