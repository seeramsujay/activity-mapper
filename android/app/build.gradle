plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

android {
    namespace "org.opensource.tracker"
    compileSdk 36
    ndkVersion "28.2.13676358"
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "org.opensource.tracker"
        minSdkVersion flutter.minSdkVersion
        targetSdk 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        manifestPlaceholders = [appName: "TurnBack", applicationName: "io.flutter.app.FlutterApplication"]
    }

    flavorDimensions "mode"

    productFlavors {
        offline {
            dimension "mode"
            applicationId "org.opensource.tracker.offline"
            manifestPlaceholders = [appName: "TurnBack (Offline)"]
            versionNameSuffix "-offline"
        }
        colab {
            dimension "mode"
            applicationId "org.opensource.tracker.colab"
            manifestPlaceholders = [appName: "TurnBack (Colab)"]
            versionNameSuffix "-colab"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
}
