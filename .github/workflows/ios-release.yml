name: iOS release build

# Builds an unsigned TurnBack IPA (for sideloading) and attaches it to a GitHub release.
on:
  release:
    types: [published]
  workflow_dispatch:
    # checkov:skip=CKV_GHA_7: Intentional. Old release tags (e.g. v1.4.0) predate this workflow file, so a manual run
    # must be dispatched from a ref that has it (the default branch) and be told which existing release to build
    # and upload to. The input is validated against real releases before anything is checked out or built, and it
    # only ever flows through an environment variable (never interpolated into a script).
    inputs:
      tag:
        description: Existing release tag to build and upload to (e.g. v1.4.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Fail fast, before any checkout/build/upload, unless the tag names an existing release.
      - name: Verify the tag names an existing release
        run: gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - run: flutter pub get

      # Tags up to v1.4.0 predate the committed Xcode workspace; recreate the
      # standard Flutter one if it is missing so `flutter build ios` can run.
      - name: Ensure Xcode workspace
        run: |
          if [ ! -f ios/Runner.xcworkspace/contents.xcworkspacedata ]; then
            git fetch --depth=1 origin master
            git checkout FETCH_HEAD -- ios/Runner.xcworkspace ios/Runner.xcodeproj/project.xcworkspace
          fi

      # iOS has no flavors; the Runner scheme builds lib/main.dart.
      - name: Build (no codesign)
        run: flutter build ios --release --no-codesign -t lib/main.dart

      - name: Package IPA
        run: |
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          cd dist
          zip -qry "TurnBack-iOS-$TAG.ipa" Payload
          shasum -a 256 "TurnBack-iOS-$TAG.ipa" | tee "TurnBack-iOS-$TAG.ipa.sha256"

      - name: Upload to release
        run: gh release upload "$TAG" "dist/TurnBack-iOS-$TAG.ipa" --clobber -R "$GITHUB_REPOSITORY"
