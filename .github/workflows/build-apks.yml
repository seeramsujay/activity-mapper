name: Build and Release APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build for (e.g. v2.0.0)'
        required: true
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  build-compose-apks:
    name: Build Jetpack Compose APKs (Per-ABI & Universal)
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Compose APKs
        run: ./gradlew assembleRelease --stacktrace

      - name: Package Compose APKs
        run: |
          mkdir -p dist
          TAG="${{ github.ref_name || inputs.tag }}"
          
          # Copy all produced release APKs (Universal and Per-ABI: arm64-v8a, armeabi-v7a, x86_64)
          find app/build/outputs/apk/release/ -name "*.apk" | while read -r apk_file; do
            base_name=$(basename "$apk_file")
            clean_name=$(echo "$base_name" | sed "s/app-/TurnBack-Compose-$TAG-/")
            cp "$apk_file" "dist/$clean_name"
          done
          
          cd dist
          shasum -a 256 *.apk | tee sha256_compose.txt
          ls -la

      - name: Upload Compose APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compose-apks
          path: dist/

  build-flutter-apks:
    name: Build Legacy Flutter APKs (Offline & Colab, Per-ABI & Universal)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code from Flutter archive
        uses: actions/checkout@v4
        with:
          ref: archive/v1.4.0-turnback
          path: flutter-source

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5
          cache: true

      - name: Build Flutter Offline APKs (Universal + Per-ABI splits)
        working-directory: flutter-source
        run: |
          flutter pub get
          # 1. Universal Offline APK
          flutter build apk --flavor offline --target lib/main_offline.dart --release
          # 2. Per-ABI split Offline APKs (arm64-v8a, armeabi-v7a, x86_64)
          flutter build apk --flavor offline --target lib/main_offline.dart --release --split-per-abi

      - name: Build Flutter Colab APKs (Universal + Per-ABI splits)
        working-directory: flutter-source
        run: |
          # 1. Universal Colab APK
          flutter build apk --flavor colab --target lib/main_colab.dart --release
          # 2. Per-ABI split Colab APKs (arm64-v8a, armeabi-v7a, x86_64)
          flutter build apk --flavor colab --target lib/main_colab.dart --release --split-per-abi

      - name: Package Flutter APKs
        run: |
          mkdir -p dist
          TAG="${{ github.ref_name || inputs.tag }}"
          
          # Find and organize all offline and colab APKs
          find flutter-source/build/app/outputs/flutter-apk/ -name "*.apk" | while read -r apk_file; do
            base_name=$(basename "$apk_file")
            clean_name=$(echo "$base_name" | sed "s/app-/TurnBack-Flutter-$TAG-/")
            cp "$apk_file" "dist/$clean_name"
          done
          
          cd dist
          shasum -a 256 *.apk | tee sha256_flutter.txt
          ls -la

      - name: Upload Flutter APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apks
          path: dist/

  publish-release:
    name: Create GitHub Release with All APK Variants
    needs: [build-compose-apks, build-flutter-apks]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Compose APK Artifacts
        uses: actions/download-artifact@v4
        with:
          name: compose-apks
          path: release-assets/

      - name: Download Flutter APK Artifacts
        uses: actions/download-artifact@v4
        with:
          name: flutter-apks
          path: release-assets/

      - name: Publish or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name || inputs.tag }}
        run: |
          echo "Publishing complete suite of APKs for tag: $TAG"
          ls -la release-assets/

          NOTES_FILE=$(mktemp)
          cat << 'EOF' > "$NOTES_FILE"
          Automated release build providing a comprehensive set of APK binaries (Native Jetpack Compose & Flutter, Per-ABI splits, and Offline/Colab flavors).

          ### 📦 Included APK Binaries:

          #### 1. Native Jetpack Compose (Modern Material 3 Rebuild)
          - Universal APK: TurnBack-Compose-universal-release.apk
          - ARM 64-bit (Modern devices): TurnBack-Compose-arm64-v8a-release.apk
          - ARM 32-bit (Older devices): TurnBack-Compose-armeabi-v7a-release.apk
          - x86_64 (Emulators): TurnBack-Compose-x86_64-release.apk

          #### 2. Flutter Offline Flavor (100% Offline GPS & Local Maps)
          - Universal: TurnBack-Flutter-offline-release.apk
          - Per-ABI Splits: arm64-v8a, armeabi-v7a, x86_64

          #### 3. Flutter Colab Flavor (P2P Mesh Group Rides & Strava)
          - Universal: TurnBack-Flutter-colab-release.apk
          - Per-ABI Splits: arm64-v8a, armeabi-v7a, x86_64

          *Verified via CodeRabbit AI Review & GitHub Super-Linter.*
          EOF
          
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists, uploading assets..."
            gh release upload "$TAG" release-assets/* --clobber
          else
            echo "Creating new release for $TAG..."
            gh release create "$TAG" release-assets/* \
              --title "TurnBack $TAG" \
              --notes-file "$NOTES_FILE"
          fi
